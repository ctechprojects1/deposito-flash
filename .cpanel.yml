---
deployment:
  tasks:
    # Diretório raiz da aplicação (um nível acima do document root /public).
    # Ajuste se o caminho absoluto da sua conta for diferente.
    - export DEPLOYPATH=/home1/ecoman77/deposito-flash
    # Copia o código para o diretório de produção (merge, sem apagar .env nem
    # storage/app). Como .env não está no repositório, ele é preservado.
    - /bin/cp -R app "$DEPLOYPATH"
    - /bin/cp -R bootstrap "$DEPLOYPATH"
    - /bin/cp -R config "$DEPLOYPATH"
    - /bin/cp -R database "$DEPLOYPATH"
    # public/ é copiado SEM o .htaccess: o MultiPHP Manager do cPanel grava
    # nele a linha (AddHandler) que define a versão do PHP do subdomínio, e
    # copiar a versão do repositório por cima voltaria o site para a versão
    # herdada da conta a cada deploy. Mudanças no public/.htaccess do
    # repositório precisam ser aplicadas à mão no servidor. Só é copiado se
    # ainda não existir lá (primeira instalação).
    - /usr/bin/find public -type f ! -name .htaccess -exec /bin/cp --parents {} "$DEPLOYPATH" \;
    - '[ -f "$DEPLOYPATH/public/.htaccess" ] || /bin/cp public/.htaccess "$DEPLOYPATH/public/.htaccess"'
    - /bin/cp -R resources "$DEPLOYPATH"
    - /bin/cp -R routes "$DEPLOYPATH"
    - /bin/cp -R vendor "$DEPLOYPATH"
    - /bin/cp artisan "$DEPLOYPATH"
    - /bin/cp composer.json "$DEPLOYPATH"
    - /bin/cp composer.lock "$DEPLOYPATH"
    # Limpa e refaz os caches do Laravel (config, rotas, views) a cada deploy;
    # sem isso, um cache antigo pode derrubar o site após atualizar o framework.
    # O cPanel não tem Terminal nesta conta, por isso roda aqui. Usa o PHP mais
    # novo (>= 8.2, exigido pelo Laravel 12) instalado; senão, o "php" padrão.
    - PHP_BIN=php; for v in 85 84 83 82; do if [ -x "/opt/cpanel/ea-php$v/root/usr/bin/php" ]; then PHP_BIN="/opt/cpanel/ea-php$v/root/usr/bin/php"; break; fi; done; cd "$DEPLOYPATH" && "$PHP_BIN" artisan optimize:clear && "$PHP_BIN" artisan config:cache && "$PHP_BIN" artisan route:cache && "$PHP_BIN" artisan view:cache
